[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs once before each new revision goes live. Applies any pending DB
# migrations before traffic is routed to the new container.
preDeployCommand = ["cd server && bunx prisma migrate deploy"]
# Terminus exposes /api/health on the http.Server and returns 503 when
# the DB or pg-boss is unreachable.
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
