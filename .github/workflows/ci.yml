name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel an in-progress run if a newer commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Generate the Prisma client (output: server/src/generated/prisma).
      # tsc needs it on disk to type-check imports from `../generated/prisma/client`.
      # Prisma 7's config loader requires DATABASE_URL even though `generate`
      # doesn't connect — placeholder mirrors the Dockerfile.
      - run: bunx prisma generate
        working-directory: server
        env:
          DATABASE_URL: postgres://build@build/build
      - run: bun run typecheck

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Only fail on high/critical CVEs so moderate upstream advisories don't
      # block PRs. Lower-severity issues still show in the workflow output.
      - run: bun audit --audit-level=high

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: client

  test-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helpdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/helpdesk_test
      BETTER_AUTH_SECRET: ci-test-secret-padded-to-meet-the-32-char-minimum
      BETTER_AUTH_URL: http://localhost:3000
      CLIENT_URL: http://localhost:5173
      RESEND_API_KEY: re_test_fake
      RESEND_WEBHOOK_SECRET: whsec_MfKQ9r8GHY+FrmMzAiYWaHUvF7jHvpkVEqb9bEcKLTo=
      GOOGLE_GENERATIVE_AI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Generate the Prisma client before tests — vitest imports from
      # `../generated/prisma/client` which only exists after `prisma generate`.
      - run: bunx prisma generate
        working-directory: server
      - run: bunx prisma migrate deploy
        working-directory: server
      - run: bun run test
        working-directory: server

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Verify the Dockerfile builds end-to-end. No push, no registry.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          tags: helpdesk:ci
